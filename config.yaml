backend:
  url: https://api.retrospeedlab.com

kafka:
  bootstrap: retro-speedlab-kafka.web:9092
  retention_hours: 168
  backend_topics:
    - runs.live
    - runs.snapshots
    - lab.runs
    - lab.reports
    - highscores.entries
    - stream.exposures
    - promotion.drafts
    - promotion.metrics
    - promotion.usage
    - hosts.metrics
    - donations.events
    - articles.metrics
  search_topics:
    - runs.attempts
    - runs.steps
    - runs.records
    - policy.rounds
    - lab.events
    - chat.events
    - runs.allocations
    - runs.turn_minutes
    - twitch.minutes

relay:
  poll_seconds: 1
  batch: 200
  cursor: /lake/state/relay-cursor

lake:
  bronze: /lake/bronze
  serving: s3a://retro-speedlab-lake
  checkpoints: /lake/checkpoints
  endpoint: https://lake.retrospeedlab.com

spark:
  master: local[2]
  driver_memory: 1400m
  shuffle_partitions: 4
  jars_dir: /opt/spark-jars
  packages: []

stream:
  live_trigger_seconds: 30
  silver_trigger_seconds: 300
  search_trigger_seconds: 300
  status_seconds: 60

mining:
  working: /runner
  speedlab: /lakehouse/speedlab
  games_url: https://games.retrospeedlab.com
  min_available_mb: 3000

bandit:
  min_share: 0.1
  days: 14
  draws: 20000

engagement:
  window_days: 28
  backfill_hours: 48
  prior_weight: 10
  min_visibility: 0.3
  draws: 4000
  holdout_share: 0.12
  block_minutes: 30
  min_exposures: 200
  min_hours: 12
  min_blocks: 12
  plan: {horizon_weeks: 4, minimum_effect: 0.2, power: 0.8, switch_speedup: 2}
  surfaces:
    home_games: {family: beta, metric: click_rate, holdout: true, catalog: true}
    home_sections: {family: beta, metric: click_rate, holdout: true, catalog: false}
    games_cards: {family: beta, metric: click_rate, holdout: true, catalog: true}
    stream_scenes: {family: gamma, metric: chat_per_minute, holdout: true, catalog: false}
    stream_clips: {family: gamma, metric: chat_per_minute, holdout: true, catalog: true}
    stream_games: {family: gamma, metric: chat_per_minute, holdout: false, catalog: true}
    promotion: {family: gamma, metric: interactions_per_post, holdout: false, catalog: false}
    promotion_variants: {family: beta, metric: approval_rate, holdout: false, catalog: false}
    bluesky_hook: {family: gamma, metric: interactions_per_post, holdout: false, catalog: false}
    bluesky_length: {family: gamma, metric: interactions_per_post, holdout: false, catalog: false}
    bluesky_media: {family: gamma, metric: interactions_per_post, holdout: false, catalog: false}
    bluesky_tags: {family: gamma, metric: interactions_per_post, holdout: false, catalog: false}
    bluesky_cta: {family: gamma, metric: interactions_per_post, holdout: false, catalog: false}
    twitch_channel: {family: gamma, metric: follows_per_hour, holdout: true, catalog: false}
  experiments:
    cta_copy: {scope: visit, variants: [watch_live, beat_the_ai], goals: [click]}
    hero_text: {scope: visit, variants: [current, challenge], goals: [click]}
    win_dialog: {scope: visit, variants: [current, compact], goals: [signin, saved]}
    title_style:
      scope: time
      variants: [facts, challenge]
      goals: [chat_messages_per_block, new_followers_per_block, average_viewers]
    commentary_style:
      scope: time
      variants: [current, explainer]
      goals: [chat_messages_per_block, new_followers_per_block, average_viewers]
    overlay_emphasis:
      scope: time
      variants: [balanced, highscore]
      goals: [chat_messages_per_block, new_followers_per_block, average_viewers]

chat:
  ignored:
    - streamelements
    - sery_bot

sources:
  github:
    repositories:
      - RetroSpeedLab/retro-speedlab-core
      - RetroSpeedLab/retro-speedlab-engine
      - RetroSpeedLab/retro-speedlab-games
      - RetroSpeedLab/retro-speedlab-runner
      - RetroSpeedLab/retro-speedlab-backend
      - RetroSpeedLab/retro-speedlab-frontend
      - RetroSpeedLab/retro-speedlab-stream
      - RetroSpeedLab/retro-speedlab-lakehouse
      - RetroSpeedLab/retro-speedlab-maintainer
      - datenwissenschaften/spark-data-quality
      - datenwissenschaften/experimentation-toolkit
  uptime:
    url: https://uptime.datenwissenschaften.com
    page: retrospeedlab
  tempo:
    url: http://retro-speedlab-tempo:3200
  bluesky:
    handle: retrospeedlab.bsky.social
  umami:
    games_website: 5a373581-adde-48eb-a9d1-dd4955f108a7
    itch_website: 9f79bbcd-8016-43c5-958a-589d149354b5
    dropoff_since: 2026-11-16T10:00:00Z

experiments_database:
  host: retro-speedlab-experiments-postgres
  port: 5432
  name: experiments
  user: lakehouse
