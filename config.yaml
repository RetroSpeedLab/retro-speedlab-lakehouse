backend:
  url: https://api.retrospeedlab.com

kafka:
  bootstrap: retro-speedlab-kafka.web:9092
  retention_hours: 168
  backend_topics:
    - runs.live
    - runs.snapshots
    - lab.runs
    - lab.reports
    - highscores.entries
    - stream.exposures
    - promotion.drafts
    - promotion.metrics
    - promotion.usage
    - hosts.metrics
  search_topics:
    - runs.attempts
    - runs.steps
    - runs.records
    - policy.rounds
    - lab.events
    - chat.events
    - runs.allocations
    - twitch.minutes

relay:
  poll_seconds: 1
  batch: 200
  cursor: /lake/state/relay-cursor

lake:
  bronze: /lake/bronze
  serving: s3a://retro-speedlab-lake
  checkpoints: /lake/checkpoints
  endpoint: https://lake.retrospeedlab.com

spark:
  master: local[2]
  driver_memory: 1400m
  shuffle_partitions: 4
  jars_dir: /opt/spark-jars
  packages: []

stream:
  live_trigger_seconds: 30
  silver_trigger_seconds: 300
  search_trigger_seconds: 300
  status_seconds: 60

mining:
  working: /runner
  speedlab: /lakehouse/speedlab
  games_url: https://games.retrospeedlab.com
  min_available_mb: 3000

bandit:
  min_share: 0.1
  days: 14
  draws: 20000

engagement:
  window_days: 28
  backfill_hours: 48
  prior_weight: 10
  min_visibility: 0.3
  draws: 4000
  holdout_share: 0.12
  block_minutes: 30
  min_exposures: 200
  min_hours: 12
  min_blocks: 12
  surfaces:
    home_games: {family: beta, holdout: true, catalog: true}
    home_sections: {family: beta, holdout: true, catalog: false}
    games_cards: {family: beta, holdout: true, catalog: true}
    stream_scenes: {family: gamma, holdout: true, catalog: false}
    stream_clips: {family: gamma, holdout: true, catalog: true}
    stream_games: {family: gamma, holdout: false, catalog: true}
    promotion: {family: gamma, holdout: false, catalog: false}
    twitch_channel: {family: gamma, holdout: false, catalog: false}
  experiments:
    cta_copy: {scope: visit, variants: [watch_live, beat_the_ai], goals: [click]}
    hero_text: {scope: visit, variants: [current, challenge], goals: [click]}
    win_dialog: {scope: visit, variants: [current, compact], goals: [signin, saved]}
    title_style: {scope: time, variants: [facts, challenge], goals: []}
    commentary_style: {scope: time, variants: [current, explainer], goals: []}
    overlay_emphasis: {scope: time, variants: [balanced, highscore], goals: []}

chat:
  ignored:
    - streamelements
    - sery_bot

findings:
  baseline_days: 7
  min_baseline_days: 3
  change: 0.25
  stuck_watch_hours: 3
  stuck_act_hours: 8
  failed_runs_act: 3
  stream_watch_minutes: 10
  stream_act_minutes: 30
  disk_watch_percent: 85
  disk_act_percent: 92
  actions:
    search_idle: "Check that the runner is up and that its workers are searching."
    search_stuck: "Check the runner's log for {game} and move its workers to a game that still improves."
    failed_jobs: "Open the failed tasks in Airflow, fix the cause and clear them."
    quality: "Open the failing quality reports and fix the input before the next run."
    stream: "Check the stream job's log and restart the lakehouse stream if it is stuck."
    disk: "Free disk on {host}: vacuum old Delta files and prune unused Docker images."

sources:
  github:
    owner: RetroSpeedLab
    repositories:
      - retro-speedlab-core
      - retro-speedlab-engine
      - retro-speedlab-games
      - retro-speedlab-runner
      - retro-speedlab-backend
      - retro-speedlab-frontend
      - retro-speedlab-stream
      - retro-speedlab-lakehouse
      - retro-speedlab-maintainer
      - spark-data-quality
      - experimentation-toolkit
  uptime:
    url: https://uptime.datenwissenschaften.com
    page: retrospeedlab
  umami:
    games_website: 5a373581-adde-48eb-a9d1-dd4955f108a7
    itch_website: 9f79bbcd-8016-43c5-958a-589d149354b5
    dropoff_since: 2026-11-16T10:00:00Z
