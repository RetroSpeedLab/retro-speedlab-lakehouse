include /etc/nginx/gate/gate.conf;

location = /health {
    include /etc/nginx/gate/proxy.conf;
    proxy_set_header X-Gate-User "";
    proxy_pass http://retro-speedlab-database-8088;
}

location ~ ^/(?!\.well-known/acme-challenge/|(400|404|500|502)-error\.html$) {
    include /etc/nginx/gate/signed-in.conf;
    include /etc/nginx/gate/proxy.conf;
    include /etc/nginx/gate/secrets/database.conf;
    proxy_read_timeout 300s;
    proxy_pass http://retro-speedlab-database-8088;
}
