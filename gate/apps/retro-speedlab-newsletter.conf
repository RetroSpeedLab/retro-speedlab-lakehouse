include /etc/nginx/gate/gate.conf;

location ~ ^/(subscription|link|campaign|archive|public|uploads)(/|\.xml$|$)|^/api/public/ {
    include /etc/nginx/gate/proxy.conf;
    proxy_pass http://retro-speedlab-newsletter-8088;
}

location = /admin/login {
    include /etc/nginx/gate/signed-in.conf;
    include /etc/nginx/gate/proxy.conf;
    include /etc/nginx/gate/secrets/newsletter.conf;
    proxy_method POST;
    proxy_set_header Content-Type application/x-www-form-urlencoded;
    proxy_pass http://retro-speedlab-newsletter-8088/admin/login;
}

location ~ ^/(?!\.well-known/acme-challenge/|(400|404|500|502)-error\.html$) {
    include /etc/nginx/gate/signed-in.conf;
    include /etc/nginx/gate/proxy.conf;
    proxy_pass http://retro-speedlab-newsletter-8088;
}
