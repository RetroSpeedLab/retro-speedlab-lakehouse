include /etc/nginx/gate/gate.conf;

location ~ ^/(api/|script\.js$) {
    include /etc/nginx/gate/proxy.conf;
    proxy_pass http://tracking-3001;
}

location = /login {
    include /etc/nginx/gate/signed-in.conf;
    include /etc/nginx/gate/proxy.conf;
    default_type text/html;
    alias /etc/nginx/gate/umami-login.html;
}

location = /_gate/umami {
    include /etc/nginx/gate/signed-in.conf;
    include /etc/nginx/gate/proxy.conf;
    include /etc/nginx/gate/secrets/tracking.conf;
    proxy_method POST;
    proxy_set_header Content-Type application/json;
    proxy_pass http://tracking-3001/api/auth/login;
}

location ~ ^/(?!\.well-known/acme-challenge/|(400|404|500|502)-error\.html$) {
    include /etc/nginx/gate/signed-in.conf;
    include /etc/nginx/gate/proxy.conf;
    proxy_pass http://tracking-3001;
}
