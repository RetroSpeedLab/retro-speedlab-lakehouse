include /etc/nginx/gate/gate.conf;

location ~ ^/(api/push|api/badge|api/status-page|status|assets|upload)/|^/(icon\.svg|favicon\.ico|apple-touch-icon\.png|manifest\.json)$ {
    include /etc/nginx/gate/proxy.conf;
    proxy_pass http://uptime-3001;
}

location ~ ^/(?!\.well-known/acme-challenge/|(400|404|500|502)-error\.html$) {
    include /etc/nginx/gate/signed-in.conf;
    include /etc/nginx/gate/proxy.conf;
    include /etc/nginx/gate/framed.conf;
    proxy_pass http://uptime-3001;
}
