if ($gate_insecure) {
    return 301 https://$host$request_uri;
}

location = /_gate/check {
    internal;
    proxy_pass http://retro-speedlab-backend-5000/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host sso.retrospeedlab.com;
    proxy_set_header X-Gate-Host $host;
    proxy_set_header X-Gate-Method $request_method;
}

location = /_gate/enter {
    internal;
    proxy_pass http://retro-speedlab-backend-5000/enter;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host sso.retrospeedlab.com;
    proxy_set_header X-Gate-Host $host;
    proxy_set_header X-Gate-Uri $request_uri;
}

location = /_gate/adopt {
    proxy_pass http://retro-speedlab-backend-5000/adopt$is_args$args;
    proxy_set_header Host sso.retrospeedlab.com;
    proxy_set_header X-Gate-Host $host;
}
