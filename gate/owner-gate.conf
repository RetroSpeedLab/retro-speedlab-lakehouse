map "$scheme$request_uri" $gate_insecure {
    default 0;
    "~^http/\.well-known/acme-challenge/" 0;
    "~^http/" 1;
}

map "$http_sec_fetch_site $http_sec_fetch_mode $request_method" $gate_cross_site {
    default 0;
    "~^cross-site " 1;
    "cross-site navigate GET" 0;
}

map $upstream_http_content_security_policy $gate_frame_policy {
    "" "frame-ancestors https://tools.retrospeedlab.com";
    "~^(?<policy_start>.*)frame-ancestors 'self'(?<policy_end>.*)$" "${policy_start}frame-ancestors 'self' https://tools.retrospeedlab.com${policy_end}";
    default "${upstream_http_content_security_policy}; frame-ancestors https://tools.retrospeedlab.com";
}
