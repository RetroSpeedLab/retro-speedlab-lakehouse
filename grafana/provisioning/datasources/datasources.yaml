apiVersion: 1
prune: true
datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://retro-speedlab-tempo:3200
    isDefault: true
    editable: false
  - name: Experiments
    uid: experiments
    type: grafana-postgresql-datasource
    access: proxy
    url: retro-speedlab-experiments-postgres:5432
    user: grafana
    editable: false
    jsonData:
      database: experiments
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: $EXPERIMENTS_READER_PASSWORD
