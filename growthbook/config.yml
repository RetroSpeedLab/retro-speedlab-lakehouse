organization:
  settings:
    statsEngine: frequentist

datasources:
  lake:
    type: postgres
    name: Retro Speedlab lake
    description: The experiment units and metric events the lakehouse exports every night
    params:
      host: retro-speedlab-growthbook-postgres
      port: 5432
      user: growthbook
      password: ${LAKE_READER_PASSWORD}
      database: growthbook
      ssl: false
      defaultSchema: public
    settings:
      userIdTypes:
        - userIdType: unit_id
          description: A view of a site test or ranked surface, an hour or stream block, a search turn or a promotion draft
      queries:
        exposure:
          - id: units
            name: Experiment units
            userIdType: unit_id
            userIdTypes: [unit_id]
            dimensions: []
            query: SELECT unit_id, assigned_at AS timestamp, experiment_id, variation_id FROM units

metrics:
  click:
    name: Click
    description: The view led to a click on the tested element
    type: binomial
    datasource: lake
    userIdTypes: [unit_id]
    sql: SELECT unit_id, measured_at AS timestamp FROM metric_events WHERE metric = 'click'
  signin:
    name: Sign-in
    description: The win dialog's view led to a sign-in
    type: binomial
    datasource: lake
    userIdTypes: [unit_id]
    sql: SELECT unit_id, measured_at AS timestamp FROM metric_events WHERE metric = 'signin'
  saved:
    name: Saved run
    description: The win dialog's view led to a saved run
    type: binomial
    datasource: lake
    userIdTypes: [unit_id]
    sql: SELECT unit_id, measured_at AS timestamp FROM metric_events WHERE metric = 'saved'
  chat_per_minute:
    name: Chat messages per minute
    description: Twitch chat messages per minute of the hour or stream block
    type: count
    datasource: lake
    userIdTypes: [unit_id]
    sql: SELECT unit_id, measured_at AS timestamp, value FROM metric_events WHERE metric = 'chat_per_minute'
  viewers:
    name: Viewers
    description: Average Twitch viewers of the stream block
    type: count
    datasource: lake
    userIdTypes: [unit_id]
    sql: SELECT unit_id, measured_at AS timestamp, value FROM metric_events WHERE metric = 'viewers'
  follows_per_hour:
    name: Follows per hour
    description: New Twitch followers per hour of the stream block
    type: count
    datasource: lake
    userIdTypes: [unit_id]
    sql: SELECT unit_id, measured_at AS timestamp, value FROM metric_events WHERE metric = 'follows_per_hour'
  frames_saved_per_hour:
    name: Frames saved per hour
    description: Frames the search saved per hour of the turn
    type: count
    datasource: lake
    userIdTypes: [unit_id]
    sql: SELECT unit_id, measured_at AS timestamp, value FROM metric_events WHERE metric = 'frames_saved_per_hour'
  approved:
    name: Approved
    description: The maintainer approved the promotion draft
    type: binomial
    datasource: lake
    userIdTypes: [unit_id]
    sql: SELECT unit_id, measured_at AS timestamp FROM metric_events WHERE metric = 'approved'
  interactions_24h:
    name: Bluesky interactions at 24 h
    description: Likes, reposts, replies and quotes of the published post at 24 h, zero for a draft that was not posted
    type: count
    datasource: lake
    userIdTypes: [unit_id]
    sql: SELECT unit_id, measured_at AS timestamp, value FROM metric_events WHERE metric = 'interactions_24h'
