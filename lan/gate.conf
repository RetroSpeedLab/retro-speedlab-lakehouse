location = /_gate/check {
    internal;
    proxy_pass https://sso.retrospeedlab.com/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Gate-Host $host;
    proxy_set_header X-Gate-Method $request_method;
    proxy_cache retro_speedlab_gate;
    proxy_cache_key "$request_method $cookie_retro_speedlab_owner";
    proxy_cache_valid 204 60s;
}

location = /_gate/enter {
    internal;
    proxy_pass https://sso.retrospeedlab.com/enter;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Gate-Host $host;
    proxy_set_header X-Gate-Uri $request_uri;
}
