proxy_cache_path /var/lib/nginx/retro-speedlab-gate levels=1 keys_zone=retro_speedlab_gate:1m max_size=16m inactive=10m;

server {
    listen {{LAN_ADDRESS}}:80 default_server;
    listen {{LAN_ADDRESS}}:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen {{LAN_ADDRESS}}:80;
    server_name tools.retrospeedlab.com grafana.retrospeedlab.com;
    return 301 https://$host$request_uri;
}

server {
    listen {{LAN_ADDRESS}}:443 ssl;
    server_name tools.retrospeedlab.com;
    include /etc/nginx/retro-speedlab-lan/server.conf;
    include /etc/nginx/retro-speedlab-lan/gate.conf;
    root /etc/nginx/retro-speedlab-lan/tools;

    location = / {
        include /etc/nginx/retro-speedlab-lan/signed-in.conf;
        add_header Strict-Transport-Security "max-age=15724800; includeSubdomains" always;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location / {
        return 404;
    }
}

server {
    listen {{LAN_ADDRESS}}:443 ssl;
    server_name grafana.retrospeedlab.com;
    include /etc/nginx/retro-speedlab-lan/server.conf;
    include /etc/nginx/retro-speedlab-lan/gate.conf;

    location / {
        include /etc/nginx/retro-speedlab-lan/signed-in.conf;
        include /etc/nginx/retro-speedlab-lan/proxy.conf;
        include /etc/nginx/retro-speedlab-lan/framed.conf;
        proxy_pass http://127.0.0.1:18094;
    }
}
