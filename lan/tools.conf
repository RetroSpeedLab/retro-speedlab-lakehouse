server {
    listen {{LAN_ADDRESS}}:80 default_server;
    listen {{LAN_ADDRESS}}:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen {{LAN_ADDRESS}}:80;
    server_name database.retrospeedlab.com growthbook.retrospeedlab.com growthbook-api.retrospeedlab.com;
    return 301 https://$host$request_uri;
}

server {
    listen {{LAN_ADDRESS}}:443 ssl;
    server_name database.retrospeedlab.com;
    include /etc/nginx/retro-speedlab-lan/server.conf;

    location / {
        proxy_pass http://127.0.0.1:18088;
    }
}

server {
    listen {{LAN_ADDRESS}}:443 ssl;
    server_name growthbook.retrospeedlab.com;
    include /etc/nginx/retro-speedlab-lan/server.conf;

    location / {
        proxy_pass http://127.0.0.1:18089;
    }
}

server {
    listen {{LAN_ADDRESS}}:443 ssl;
    server_name growthbook-api.retrospeedlab.com;
    include /etc/nginx/retro-speedlab-lan/server.conf;

    location ~* ^/auth/(register|firsttime) {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:18090;
    }
}
