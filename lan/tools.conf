proxy_cache_path /var/lib/nginx/retro-speedlab-gate levels=1 keys_zone=retro_speedlab_gate:1m max_size=16m inactive=10m;

server {
    listen {{LAN_ADDRESS}}:80 default_server;
    listen {{LAN_ADDRESS}}:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen {{LAN_ADDRESS}}:80;
    server_name database.retrospeedlab.com growthbook.retrospeedlab.com growthbook-api.retrospeedlab.com;
    return 301 https://$host$request_uri;
}

server {
    listen {{LAN_ADDRESS}}:443 ssl;
    server_name database.retrospeedlab.com;
    include /etc/nginx/retro-speedlab-lan/server.conf;
    include /etc/nginx/retro-speedlab-lan/gate.conf;

    location / {
        include /etc/nginx/retro-speedlab-lan/signed-in.conf;
        include /etc/nginx/retro-speedlab-lan/proxy.conf;
        proxy_set_header X-Gate-User owner;
        proxy_pass http://127.0.0.1:18088;
    }
}

server {
    listen {{LAN_ADDRESS}}:443 ssl;
    server_name growthbook.retrospeedlab.com;
    include /etc/nginx/retro-speedlab-lan/server.conf;
    include /etc/nginx/retro-speedlab-lan/gate.conf;

    location = /_gate/growthbook {
        include /etc/nginx/retro-speedlab-lan/signed-in.conf;
        add_header Set-Cookie "growthbook_gate=1; Max-Age=86400; Path=/; Secure; HttpOnly; SameSite=Lax";
        default_type text/html;
        alias /etc/nginx/retro-speedlab-lan/growthbook-login.html;
    }

    location / {
        recursive_error_pages on;
        error_page 418 = /_gate/growthbook;
        if ($cookie_growthbook_gate = "") {
            return 418;
        }
        include /etc/nginx/retro-speedlab-lan/signed-in.conf;
        include /etc/nginx/retro-speedlab-lan/proxy.conf;
        proxy_pass http://127.0.0.1:18089;
    }
}

server {
    listen {{LAN_ADDRESS}}:443 ssl;
    server_name growthbook-api.retrospeedlab.com;
    include /etc/nginx/retro-speedlab-lan/server.conf;
    include /etc/nginx/retro-speedlab-lan/gate.conf;

    location ~* ^/auth/(register|firsttime) {
        return 403;
    }

    location = /auth/gate {
        include /etc/nginx/retro-speedlab-lan/signed-in.conf;
        include /etc/nginx/retro-speedlab-lan/proxy.conf;
        include /etc/nginx/retro-speedlab-lan/secrets/growthbook.conf;
        proxy_method POST;
        proxy_set_header Content-Type application/json;
        proxy_pass http://127.0.0.1:18090/auth/login;
    }

    location ^~ /api/ {
        include /etc/nginx/retro-speedlab-lan/proxy.conf;
        proxy_pass http://127.0.0.1:18090;
    }

    location / {
        include /etc/nginx/retro-speedlab-lan/signed-in.conf;
        include /etc/nginx/retro-speedlab-lan/proxy.conf;
        proxy_pass http://127.0.0.1:18090;
    }
}
