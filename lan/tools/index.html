<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>RetroSpeedLab tools</title>
<style>
:root {
    color-scheme: dark;
    --ink: #120f12;
    --velvet: #1d171c;
    --edge: #3a2c33;
    --brass: #e6b85c;
    --mint: #61e7cf;
    --ivory: #fff8e8;
    --muted: #c8bda9;
}

* {
    box-sizing: border-box;
}

body {
    display: grid;
    grid-template-columns: 264px 1fr;
    height: 100vh;
    margin: 0;
    background: var(--ink);
    color: var(--ivory);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

nav {
    overflow-y: auto;
    padding: 20px 12px 24px;
    border-right: 1px solid var(--edge);
    background: radial-gradient(ellipse at 0% 0%, rgba(230, 184, 92, 0.08), transparent 60%), var(--velvet);
}

h1 {
    margin: 0 8px 18px;
    font-size: 19px;
    letter-spacing: 0.02em;
}

h1 span,
h2 {
    color: var(--brass);
}

h2 {
    margin: 18px 8px 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
}

ul {
    margin: 0;
    padding: 0;
    list-style: none;
}

li {
    display: flex;
    align-items: center;
    border-radius: 7px;
}

li:hover,
li[aria-current] {
    background: rgba(97, 231, 207, 0.08);
}

li[aria-current] {
    box-shadow: inset 3px 0 0 var(--mint);
}

a {
    color: inherit;
    text-decoration: none;
}

a:focus-visible {
    outline: 2px solid var(--mint);
    outline-offset: -2px;
}

.tool {
    flex: 1;
    min-width: 0;
    padding: 7px 10px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.away {
    padding: 7px 10px;
    border-radius: 7px;
    color: var(--muted);
}

.away:hover {
    color: var(--mint);
}

main {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
}

header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--edge);
    background: var(--velvet);
}

header div {
    flex: 1;
    min-width: 0;
}

header strong {
    font-size: 16px;
}

header p {
    margin: 0;
    overflow: hidden;
    color: var(--muted);
    font-size: 13px;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.open {
    flex-shrink: 0;
    padding: 7px 14px;
    border: 1px solid var(--mint);
    border-radius: 7px;
    color: var(--mint);
    font-weight: 600;
}

.open:hover {
    background: var(--mint);
    color: var(--ink);
}

#frames {
    position: relative;
    flex: 1;
}

iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #fff;
}

#outside {
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 14px;
    height: 100%;
    padding: 24px;
    color: var(--muted);
    text-align: center;
}

#outside strong {
    color: var(--ivory);
    font-size: 22px;
}

#outside p {
    margin: 0;
}

#outside .open {
    padding: 10px 22px;
    font-size: 15px;
}

[hidden] {
    display: none !important;
}

@media (max-width: 760px) {
    body {
        grid-template-columns: 1fr;
        grid-template-rows: 38vh 1fr;
    }

    nav {
        border-right: 0;
        border-bottom: 1px solid var(--edge);
    }
}
</style>
</head>
<body>
<nav aria-label="Tools">
    <h1>RetroSpeedLab <span>tools</span></h1>
    <div id="menu"></div>
</nav>
<main>
    <header>
        <div>
            <strong id="name"></strong>
            <p id="about"></p>
        </div>
        <a class="open" id="open" target="_blank" rel="noopener noreferrer">Open in new tab &#8599;</a>
    </header>
    <div id="frames">
        <div id="outside" hidden>
            <strong id="outside-name"></strong>
            <p id="outside-reason"></p>
            <a class="open" id="outside-open" target="_blank" rel="noopener noreferrer">Open in new tab &#8599;</a>
        </div>
    </div>
</main>
<script>
const GROUPS = [
    ["Analytics & experiments", [
        ["umami", "Umami", "Visitors, pages and events on the sites", "https://tracking.datenwissenschaften.com", true],
    ]],
    ["Errors & uptime", [
        ["bugsink", "Bugsink", "Errors from every app", "https://bugs.datenwissenschaften.com", true],
        ["uptime", "Uptime Kuma", "Monitors and status pages", "https://uptime.datenwissenschaften.com", true],
    ]],
    ["AI & lab", [
        ["grafana", "Grafana", "Lab traces & experiments", "https://grafana.retrospeedlab.com", true],
        ["aim", "Aim", "Training runs", "https://aim.retrospeedlab.com", true],
    ]],
    ["Code & deploys", [
        ["github", "GitHub", "Repositories, pull requests and CI", "https://github.com/RetroSpeedLab", false],
    ]],
    ["Channels", [
        ["twitch", "Twitch", "Creator dashboard of the live stream", "https://dashboard.twitch.tv/u/retrospeedlab/home", false],
        ["youtube", "YouTube Studio", "Videos, Shorts and their analytics", "https://studio.youtube.com", false],
        ["itch", "itch.io", "The game pack's page and its numbers", "https://itch.io/dashboard", false],
        ["discord", "Discord", "The community server", "https://discord.com/channels/1112317659812483092", false],
        ["google-cloud", "Google Cloud", "Console of the retro-speedlab project", "https://console.cloud.google.com/home/dashboard?project=retro-speedlab", false],
        ["bluesky", "Bluesky", "The project's posts", "https://bsky.app/profile/retrospeedlab.bsky.social", false],
    ]],
    ["Secrets", [
        ["vaultwarden", "Vaultwarden", "Passwords and keys", "https://vault.datenwissenschaften.com", false],
    ]],
    ["Public site", [
        ["www", "retrospeedlab.com", "The live run, records and the lab", "https://www.retrospeedlab.com", false],
        ["games", "RetroSpeedLab24", "The 24 games, playable in the browser", "https://games.retrospeedlab.com", false],
    ]],
];
const TOOLS = new Map(GROUPS.flatMap(([, tools]) => tools).map(([id, name, about, url, framed]) => [id, { id, name, about, url, framed }]));
const FIRST = TOOLS.keys().next().value;
const frames = document.getElementById("frames");
const outside = document.getElementById("outside");

function element(tag, properties, children) {
    const node = Object.assign(document.createElement(tag), properties);
    node.append(...children);
    return node;
}

function menuItem(tool) {
    return element("li", { id: `menu-${tool.id}` }, [
        element("a", { className: "tool", href: `#${tool.id}`, textContent: tool.name }, []),
        element("a", { className: "away", href: tool.url, target: "_blank", rel: "noopener noreferrer", title: `Open ${tool.name} in a new tab`, ariaLabel: `Open ${tool.name} in a new tab`, textContent: "↗" }, []),
    ]);
}

document.getElementById("menu").append(...GROUPS.flatMap(([group, tools]) => [
    element("h2", { textContent: group }, []),
    element("ul", {}, tools.map(([id]) => menuItem(TOOLS.get(id)))),
]));

function frameOf(tool) {
    const existing = document.getElementById(`frame-${tool.id}`);
    if (existing) {
        return existing;
    }
    const frame = element("iframe", { id: `frame-${tool.id}`, src: tool.url, title: tool.name, allow: "clipboard-write; fullscreen" }, []);
    frames.append(frame);
    return frame;
}

function show() {
    const id = location.hash.slice(1);
    if (!TOOLS.has(id)) {
        location.replace(`#${FIRST}`);
        return;
    }
    const tool = TOOLS.get(id);
    document.title = `${tool.name} · RetroSpeedLab tools`;
    document.getElementById("name").textContent = tool.name;
    document.getElementById("about").textContent = `${tool.about} · ${tool.url}`;
    document.getElementById("open").href = tool.url;
    document.getElementById("outside-name").textContent = tool.name;
    document.getElementById("outside-reason").textContent = `${tool.name} does not allow being shown inside another page.`;
    document.getElementById("outside-open").href = tool.url;
    document.querySelectorAll("li[aria-current]").forEach((item) => item.removeAttribute("aria-current"));
    document.getElementById(`menu-${id}`).setAttribute("aria-current", "page");
    const shown = tool.framed ? frameOf(tool) : outside;
    frames.querySelectorAll("iframe").forEach((frame) => { frame.hidden = frame !== shown; });
    outside.hidden = outside !== shown;
}

addEventListener("hashchange", show);
show();
</script>
</body>
</html>
