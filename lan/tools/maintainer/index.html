<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Maintainer · RetroSpeedLab tools</title>
<style>
:root {
    color-scheme: dark;
    --ink: #120f12;
    --velvet: #1d171c;
    --edge: #3a2c33;
    --brass: #e6b85c;
    --mint: #61e7cf;
    --ivory: #fff8e8;
    --muted: #c8bda9;
    --a2ui-color-background: var(--ink);
    --a2ui-color-surface: var(--velvet);
    --a2ui-color-on-background: var(--ivory);
    --a2ui-color-on-surface: var(--ivory);
    --a2ui-color-border: var(--edge);
    --a2ui-color-primary: var(--mint);
    --a2ui-color-primary-hover: #8af0de;
    --a2ui-color-on-primary: var(--ink);
    --a2ui-color-secondary: var(--edge);
    --a2ui-color-secondary-hover: #4d3a44;
    --a2ui-color-on-secondary: var(--ivory);
    --a2ui-text-caption-color: var(--muted);
    --a2ui-text-a-color: var(--brass);
    --a2ui-border-radius: 8px;
}

body {
    margin: 0;
    padding: 18px 22px 32px;
    background: var(--ink);
    color: var(--ivory);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

#status {
    margin: 0 0 14px;
    color: var(--muted);
    font-size: 12px;
}

#board {
    display: grid;
    gap: 14px;
    max-width: 920px;
}

code {
    color: var(--brass);
}
</style>
</head>
<body>
<p id="status" role="status">Loading the maintainer's queue…</p>
<div id="board"></div>
<script type="module" src="a2ui.js"></script>
</body>
</html>
