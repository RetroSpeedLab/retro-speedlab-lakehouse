[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "retro-speedlab-lakehouse"
version = "1.0.0"
description = "The Retro Speedlab lakehouse: Kafka, Spark Structured Streaming and batch jobs, Delta Lake and Airflow."
authors = [
    { name = "datenwissenschaften", email = "martin.franke@datenwissenschaften.com" }
]
license = "GPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyspark==4.1.3",
    "pyspark-data-quality==0.1.0",
    "experimentation-toolkit==0.2.0",
    "delta-spark==4.4.1",
    "apache-airflow==3.4.0",
    "apache-airflow-providers-standard==1.21.0",
    "confluent-kafka==2.16.2",
    "httpx==0.28.1",
    "numpy==2.5.5",
    "scipy==1.18.1",
    "pyxel==3.0.4",
    "tenacity==9.2.1",
    "loguru==0.8.0",
    "pydantic==2.14.4",
    "python-box==7.4.1",
    "pyyaml==6.0.4",
    "typer==0.29.2",
    "psycopg[binary]==3.3.9",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
    "pyright==1.1.414",
    "respx==0.23.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/retro_speedlab_lakehouse"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
include = ["src", "tests", "dags"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = ["hosts", "dags"]
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["hosts", "dags"]
