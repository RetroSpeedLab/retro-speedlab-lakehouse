[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "retro-speedlab-lakehouse"
version = "1.0.0"
description = "The Retro Speedlab lakehouse: Kafka, Spark Structured Streaming and batch jobs, Delta Lake and Airflow."
authors = [
    { name = "datenwissenschaften", email = "martin.franke@datenwissenschaften.com" }
]
license = "GPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyspark==4.1.3",
    "pyspark-data-quality==0.1.0",
    "experimentation-toolkit==0.2.0",
    "delta-spark==4.4.1",
    "apache-airflow==3.3.2",
    "apache-airflow-providers-standard==1.20.1",
    "confluent-kafka==2.16.0",
    "httpx==0.28.1",
    "numpy==2.5.1",
    "scipy==1.18.1",
    "pyxel==3.0.1",
    "tenacity==9.1.2",
    "loguru==0.7.3",
    "pydantic==2.12.5",
    "python-box==7.4.1",
    "pyyaml==6.0.3",
    "typer==0.20.0",
    "anthropic==2.8.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.20",
    "pyright==1.1.408",
    "respx==0.22.0",
    "duckdb==1.5.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/retro_speedlab_lakehouse"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
include = ["src", "tests", "dags"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = ["database/superset", "hosts"]
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["database/superset", "hosts"]
